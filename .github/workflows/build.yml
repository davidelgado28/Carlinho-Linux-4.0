name: Build Carlinho Linux

on:
  workflow_dispatch:
    inputs:
      iso_url:
        description: 'URL da ISO-base (vazio = descobrir o 24.04.x mais novo)'
        default: ''
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Espaço em disco
        run: df -h / /mnt

      - name: Construir o Carlinho Linux
        env:
          ISO_URL: ${{ inputs.iso_url }}
        run: sudo bash build-iso.sh

      - name: Publicar ISO como artefato
        uses: actions/upload-artifact@v4
        with:
          name: carlinho-1.0-amd64
          path: /mnt/carlinho/out/carlinho-1.0-amd64.iso*
          compression-level: 0
          retention-days: 14
